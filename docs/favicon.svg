<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <desc>pkinative — zero-dependency TypeScript toolkit for public key infrastructure: X.509 certificates, ASN.1 DER, PEM and OIDs</desc>
  <defs>
    <!-- Vertical gradient: keeps the mark readable at 16px tab size -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="2" y2="30">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Counter-rotated copy, so the cut-outs inside the key's rotated
         group sample the tile's gradient and not a rotated one. -->
    <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="2" y2="30"
                    gradientTransform="rotate(45 16 16)">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#g)"/>
  <!-- Folded corner — the family mark, opacity raised for tiny sizes -->
  <path d="M20.5 2h4.5a5 5 0 0 1 5 5v6L20.5 2z" fill="#93C5FD" opacity="0.5"/>
  <!-- The key, proportionally heavier than the logo's so the bow's eye and
       the wards survive a 16px tab. -->
  <g transform="rotate(-45 16 16)">
    <circle cx="16" cy="9.8" r="4.6" fill="#ffffff"/>
    <rect x="14.35" y="12.6" width="3.3" height="12.2" rx="0.5" fill="#ffffff"/>
    <g fill="url(#gr)">
      <circle cx="16" cy="9.8" r="2.05"/>
      <rect x="15.95" y="18.6" width="1.7" height="1.55" rx="0.3"/>
      <rect x="15.95" y="21.6" width="1.7" height="1.55" rx="0.3"/>
    </g>
  </g>
</svg>
