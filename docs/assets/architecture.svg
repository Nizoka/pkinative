<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img" aria-labelledby="architecture-title architecture-desc">
  <!-- Generated by scripts/build-guides.ts from LAYERS (scripts/lib/architecture.ts); run npm run docs:guides, never edit by hand. -->
  <title id="architecture-title">pkinative layers</title>
  <desc id="architecture-desc">The fourteen pkinative layers. src/index.ts imports every layer, and nothing imports it. types imports nothing. core imports types. hash imports types and core. asn1 imports types and core. pem imports types and core. oid imports nothing. x509 imports types, core and asn1. crypto imports types, core and asn1. build imports types, core, asn1, hash and crypto. path imports types, core and x509. revocation imports types, core, asn1, hash, x509 and build. cms imports types, core, asn1, hash, x509 and build. keys imports types, core, asn1 and crypto. verify imports types, core, asn1, hash, x509, crypto, path, revocation, cms and keys. Refused on purpose: x509 never imports oid; pem never imports asn1; crypto and build never import x509; path and cms never import crypto; keys never imports x509. Outside the package, pkinative-cli and pkinative-mcp use only its public entry point, through npm.</desc>
