<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ucish-title ucish-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="ucish-title">Issue a certificate, without ever holding the key</title>
  <desc id="ucish-desc">Architecture: a CertificateDescription, with validity in whole seconds, subjectPublicKey as SPKI DER and issuerDer as the issuer's own bytes, and a Signer, either a non-extractable SigningKey from importPrivateKey, decryptPrivateKey or openPkcs12 or an ExternalSigner for an HSM or KMS, flow into createCertificate. It encodes tbsCertificate and makes one signing call. Out comes certificate or PKCS#10 request DER, or a refusal such as PKI_ASN1_VALUE_OUT_OF_RANGE. Bands: the key is never bytes pkinative holds; the one exportKey line that extracts the SPKI is yours.</desc>

  <defs>
    <marker id="ucish-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ucish-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="ucish-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Issue a certificate, without ever holding the key</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">createCertificate(description, signer) · createCertificationRequest — the key stays in Web Crypto or your HSM</text>

  <!-- Description (indigo) -->
  <rect x="40" y="96" width="270" height="120" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="175" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#3730A3">CertificateDescription</text>
  <text x="175" y="144" text-anchor="middle" font-size="11.5" fill="#4F46E5">serialNumber · subject · extensions</text>
  <text x="175" y="162" text-anchor="middle" font-size="11.5" fill="#4F46E5">notBefore, notAfter: whole seconds</text>
  <text x="175" y="180" text-anchor="middle" font-size="11.5" fill="#4F46E5">subjectPublicKey: SPKI DER bytes</text>
  <text x="175" y="198" text-anchor="middle" font-size="11.5" fill="#4F46E5">issuerDer: the issuer's own bytes</text>

  <!-- Signer (indigo) -->
  <rect x="40" y="240" width="270" height="132" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="175" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#3730A3">Signer</text>
  <text x="175" y="288" text-anchor="middle" font-size="11.5" fill="#4F46E5">SigningKey: non-extractable CryptoKey</text>
  <text x="175" y="306" text-anchor="middle" font-size="11.5" fill="#4F46E5">or ExternalSigner — HSM, card, KMS</text>
  <text x="175" y="332" text-anchor="middle" font-size="11.5" fill="#64748B">from importPrivateKey,</text>
  <text x="175" y="350" text-anchor="middle" font-size="11.5" fill="#64748B">decryptPrivateKey or openPkcs12</text>

  <line x1="310" y1="184" x2="346" y2="184" stroke="#475569" stroke-width="1.75" marker-end="url(#ucish-ah)"/>
  <line x1="310" y1="300" x2="346" y2="300" stroke="#475569" stroke-width="1.75" marker-end="url(#ucish-ah)"/>

  <!-- Engine (cyan) -->
  <rect x="350" y="88" width="290" height="284" rx="12" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="495" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#155E75">createCertificate</text>
  <text x="495" y="131" text-anchor="middle" font-size="11.5" fill="#0E7490">createCertificationRequest — the same path</text>

  <rect x="366" y="146" width="258" height="76" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="495" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">Encode tbsCertificate</text>
  <text x="495" y="190" text-anchor="middle" font-size="11.5" fill="#0E7490">DER from the description</text>
  <text x="495" y="208" text-anchor="middle" font-size="11.5" fill="#0E7490">refuses what it would have to round</text>

  <line x1="495" y1="222" x2="495" y2="240" stroke="#475569" stroke-width="1.75" marker-end="url(#ucish-ah)"/>

  <rect x="366" y="244" width="258" height="112" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="495" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1E40AF">One signature, one call</text>
  <text x="495" y="290" text-anchor="middle" font-size="11.5" fill="#1E40AF">subtle.sign with the SigningKey</text>
  <text x="495" y="308" text-anchor="middle" font-size="11.5" fill="#1E40AF">or produceSignature(the exact bytes)</text>
  <text x="495" y="326" text-anchor="middle" font-size="11.5" fill="#1E40AF">ECDSA as raw r ‖ s, never DER</text>

  <!-- to the outputs -->
  <path d="M624 280 H652 V148 H676" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#ucish-ah-green)"/>
  <line x1="640" y1="320" x2="676" y2="320" stroke="#DC2626" stroke-width="2" marker-end="url(#ucish-ah-red)"/>

  <!-- Output (amber) -->
  <rect x="680" y="100" width="240" height="96" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="800" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">Certificate DER</text>
  <text x="800" y="146" text-anchor="middle" font-size="11.5" fill="#B45309">a Uint8Array, signed</text>
  <text x="800" y="164" text-anchor="middle" font-size="11.5" fill="#B45309">or a PKCS#10 request from</text>
  <text x="800" y="182" text-anchor="middle" font-size="11.5" fill="#B45309">createCertificationRequest</text>

  <!-- Refusals (red) -->
  <rect x="680" y="220" width="240" height="126" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="800" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">Refused, not repaired</text>
  <text x="800" y="266" text-anchor="middle" font-size="11.5" fill="#B91C1C">PKI_ASN1_VALUE_OUT_OF_RANGE</text>
  <text x="800" y="284" text-anchor="middle" font-size="11.5" fill="#B91C1C">a validity with milliseconds</text>
  <text x="800" y="308" text-anchor="middle" font-size="11.5" fill="#B91C1C">PKI_API_MISUSE</text>
  <text x="800" y="326" text-anchor="middle" font-size="11.5" fill="#B91C1C">an ECDSA signature in DER form</text>

  <!-- guarantees band (green) -->
  <rect x="40" y="416" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">The key is never bytes pkinative holds: a SigningKey signs in Web Crypto, an ExternalSigner in your HSM or KMS.</text>
  <text x="480" y="460" text-anchor="middle" font-size="12.5" fill="#16A34A">exportKey and generateKey are refused inside src/ in every version, which keeps the central security claim verifiable.</text>

  <!-- limits band (slate) -->
  <rect x="40" y="486" width="880" height="56" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="509" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Honest limits: subjectPublicKey is DER, so the one line that extracts it — exportKey('spki') — is yours, in your code.</text>
  <text x="480" y="528" text-anchor="middle" font-size="12" fill="#475569">Pass the issuer's own bytes as issuerDer, not its name; what to certify, and under which extensions, stays the CA's decision.</text>
</svg>
