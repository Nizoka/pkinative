<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="uccr-title uccr-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="uccr-title">Offline and air-gapped revocation checking</title>
  <desc id="uccr-desc">Architecture: on the connected side, pkinative ocsp request writes an OCSP request with a random nonce, and your own HTTP client posts it and fetches the CRL from URLs the certificate names. The response, the CRL and the nonce cross the air gap. There, crl check, ocsp check with --require-nonce and chain verify with --require-revocation judge that evidence at a pinned --at instant: a good certificate exits 0, a revoked one exits 1 with PKI_REASON_REVOKED and its date. Limits: the CLI never fetches, an unknown status passes unless revocation is required, and a CRL past nextUpdate fails chain verify, which takes no tolerance, and passes crl check only within --stale-tolerance.</desc>

  <defs>
    <marker id="uccr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="uccr-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="uccr-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Offline and air-gapped revocation checking</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">ocsp request · crl check · ocsp check · chain verify --require-revocation — the CLI never fetches (pkinative-cli 1.0.0)</text>

  <!-- Connected side -->
  <rect x="40" y="92" width="340" height="292" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="210" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Connected side</text>
  <text x="210" y="134" text-anchor="middle" font-size="11.5" fill="#64748B">writes the request, collects the evidence</text>

  <rect x="56" y="146" width="308" height="94" rx="10" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="210" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155E75">pkinative ocsp request</text>
  <text x="210" y="190" text-anchor="middle" font-size="11.5" fill="#0E7490">--cert leaf.pem --issuer ca.pem</text>
  <text x="210" y="206" text-anchor="middle" font-size="11.5" fill="#0E7490">--nonce random -o req.der --json</text>
  <text x="210" y="226" text-anchor="middle" font-size="11.5" fill="#0E7490">envelope: nonce (32 hex digits) → $NONCE</text>

  <line x1="210" y1="240" x2="210" y2="256" stroke="#475569" stroke-width="1.75" marker-end="url(#uccr-ah)"/>

  <rect x="56" y="258" width="308" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="210" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Your HTTP client — curl</text>
  <text x="210" y="302" text-anchor="middle" font-size="11.5" fill="#64748B">POST req.der to $OCSP_URL → resp.der</text>
  <text x="210" y="318" text-anchor="middle" font-size="11.5" fill="#64748B">GET $CRL_URL → ca.crl</text>
  <text x="210" y="340" text-anchor="middle" font-size="11.5" fill="#64748B">URLs from cert inspect --extension</text>
  <text x="210" y="356" text-anchor="middle" font-size="11.5" fill="#64748B">crlDistributionPoints · authorityInfoAccess</text>

  <!-- Air gap -->
  <text x="460" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748B">air gap</text>
  <line x1="460" y1="114" x2="460" y2="384" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="364" y1="344" x2="538" y2="344" stroke="#475569" stroke-width="1.75" marker-end="url(#uccr-ah)"/>
  <rect x="394" y="262" width="132" height="62" rx="8" fill="#F8FAFC"/>
  <text x="460" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">carried across</text>
  <text x="460" y="296" text-anchor="middle" font-size="11.5" fill="#64748B">resp.der · ca.crl</text>
  <text x="460" y="312" text-anchor="middle" font-size="11.5" fill="#64748B">and $NONCE</text>

  <!-- Air-gapped side -->
  <rect x="540" y="92" width="380" height="292" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="730" y="116" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Air-gapped side</text>
  <text x="730" y="134" text-anchor="middle" font-size="11.5" fill="#64748B">judges the evidence it was carried, offline</text>

  <rect x="556" y="146" width="348" height="118" rx="10" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="730" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155E75">Judged at a pinned --at "$AT"</text>
  <text x="730" y="192" text-anchor="middle" font-size="11.5" fill="#0E7490">crl check ca.crl --cert leaf.pem --issuer ca.pem</text>
  <text x="730" y="210" text-anchor="middle" font-size="11.5" fill="#0E7490">ocsp check resp.der --nonce "$NONCE" --require-nonce</text>
  <text x="730" y="228" text-anchor="middle" font-size="11.5" fill="#0E7490">chain verify … --crl --ocsp --require-revocation</text>
  <text x="730" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155E75">responder: the CA or its OCSPSigning delegate</text>

  <line x1="624" y1="264" x2="624" y2="278" stroke="#16A34A" stroke-width="1.75" marker-end="url(#uccr-ah-green)"/>
  <line x1="804" y1="264" x2="804" y2="278" stroke="#DC2626" stroke-width="1.75" marker-end="url(#uccr-ah-red)"/>

  <rect x="556" y="280" width="136" height="88" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.25"/>
  <text x="624" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">good — exit 0</text>
  <text x="624" y="322" text-anchor="middle" font-size="11.5" fill="#16A34A">valid: true</text>
  <text x="624" y="338" text-anchor="middle" font-size="11.5" fill="#16A34A">status: good</text>
  <text x="624" y="354" text-anchor="middle" font-size="11.5" fill="#16A34A">responder authorized</text>

  <rect x="704" y="280" width="200" height="88" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="804" y="302" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">revoked — exit 1</text>
  <text x="804" y="322" text-anchor="middle" font-size="11.5" fill="#DC2626">PKI_REASON_REVOKED + its date</text>
  <text x="804" y="338" text-anchor="middle" font-size="11" fill="#DC2626">checks: E_CHECK_FAILED</text>
  <text x="804" y="354" text-anchor="middle" font-size="11" fill="#DC2626">chain verify: E_VERIFY_FAILED</text>

  <!-- Guarantees strip -->
  <rect x="40" y="420" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">No network call, ever: the CLI writes the OCSP request you send and judges the CRL and the response you carry back.</text>
  <text x="480" y="464" text-anchor="middle" font-size="12.5" fill="#16A34A">The nonce binds the reply to the request; a responder counts only as the CA or its delegate (RFC 6960 §4.2.2.2).</text>

  <!-- Limits strip -->
  <rect x="40" y="488" width="880" height="48" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#475569">Without --require-revocation an unknown status can still verify — a soft-fail you choose explicitly.</text>
  <text x="480" y="526" text-anchor="middle" font-size="12" fill="#475569">A CRL past nextUpdate is stale: crl check takes --stale-tolerance &lt;ms&gt;, chain verify none; OCSP thisUpdate beyond --future-tolerance is refused — pin --at.</text>
</svg>
