<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="pkinative — strict by default, complete by RFC 5280, honest about what it refuses">
<!--
  pkinative GitHub social preview (1280x640 — the repository "Social preview"
  slot, a different crop from the 1200x630 Open Graph card).
  Editable vector source. Rasterise to social-preview.png with headless
  Chromium/Edge using a window size of 1280x640 and the screenshot flag:
    msedge ++headless ++disable-gpu ++hide-scrollbars ++window-size=1280,640
           ++screenshot=social-preview.png social-preview.svg
  (replace ++ with double dashes). Upload the PNG by hand in GitHub
  Settings -> General -> Social preview. The committed PNG is the artefact of
  record; docs/assets/ecosystem.json records the SHA-256 of this file, so
  editing it without re-rasterising fails the social-images rule of
  `npm run verify:docs`. Text renders through the system font stack, so
  rasterise on a machine with Segoe UI or equivalent. All text stays at
  least 40px inside every edge, GitHub's recommended safe area.
  Brand charter (shared with pdfnative and zipnative): primary #2563eb,
  accent #1d4ed8, primary-dim #3b82f6 on bg #0f172a / bg-alt #1e293b.
  Every id is sp-* namespaced so this file can be inlined next to the og
  image without clashing.
-->
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="sp-glow" cx="50%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sp-logo-grad" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sp-logo-grad-r" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37" gradientTransform="rotate(45 20 20)">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sp-bg)"/>
  <rect width="1280" height="640" fill="url(#sp-glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#1e293b"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#sp-accent)"/>

  <!-- Centred mark; the fold hairline is dropped at this scale, as the
       siblings drop theirs. -->
  <g transform="translate(566, 96)">
    <g transform="scale(3.7)">
      <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#sp-logo-grad)"/>
      <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#93C5FD" opacity="0.35"/>
      <g transform="rotate(-45 20 20)">
        <circle cx="20" cy="12.4" r="6" fill="#ffffff"/>
        <rect x="17.7" y="16" width="4.6" height="14.8" rx="0.7" fill="#ffffff"/>
        <g fill="url(#sp-logo-grad-r)">
          <circle cx="20" cy="12.4" r="2.6"/>
          <rect x="20.2" y="22.6" width="2.1" height="2" rx="0.35"/>
          <rect x="20.2" y="26.4" width="2.1" height="2" rx="0.35"/>
        </g>
      </g>
    </g>
  </g>

  <text x="640" y="356" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-2">pkinative</text>

  <text x="640" y="416" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="500" fill="#e2e8f0">Strict by default · complete by RFC 5280 · honest about what it refuses</text>
  <text x="640" y="458" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="23" fill="#94a3b8">Zero dependencies — Node, browsers, Deno, Bun and Workers · 0.1 reads, 0.3 verifies</text>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
     font-size="22" fill="#cbd5e1" text-anchor="middle">
    <rect x="185" y="502" width="152" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="261" y="533">Strict DER</text>
    <rect x="353" y="502" width="148" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="427" y="533">RFC 5280</text>
    <rect x="517" y="502" width="98" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="566" y="533">PEM</text>
    <rect x="631" y="502" width="102" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="682" y="533">OIDs</text>
    <rect x="749" y="502" width="160" height="48" rx="24" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
    <text x="829" y="533" fill="#bfdbfe">x509-limbo</text>
    <rect x="925" y="502" width="170" height="48" rx="24" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
    <text x="1010" y="533" fill="#bfdbfe">Wycheproof</text>
  </g>

  <text x="640" y="600" text-anchor="middle"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#475569">pkinative.dev · library · MIT · open source · pre-1.0 is a git tag, not an npm release</text>
</svg>
