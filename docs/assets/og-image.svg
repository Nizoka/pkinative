<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pkinative — native PKI for TypeScript: strict DER, RFC 5280, PEM and OIDs, with zero dependencies">
<!--
  pkinative Open Graph / social share image (1200x630).
  Editable vector source. Rasterise to og-image.png with headless
  Chromium/Edge using a window size of 1200x630 and the screenshot flag:
    msedge ++headless ++disable-gpu ++hide-scrollbars ++window-size=1200,630
           ++screenshot=og-image.png og-image.svg
  (replace ++ with double dashes). The committed PNG is the artefact of
  record — no social platform renders SVG — and docs/assets/ecosystem.json
  records the SHA-256 of this file, so editing it without re-rasterising
  fails the social-images rule of `npm run verify:docs`. Text renders
  through the system font stack, so rasterise on a machine with Segoe UI
  or equivalent.
  Brand charter (shared with pdfnative and zipnative): primary #2563eb,
  accent #1d4ed8, primary-dim #3b82f6 on bg #0f172a / bg-alt #1e293b.
-->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="14%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="logo-grad" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logo-grad-r" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37" gradientTransform="rotate(45 20 20)">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1e293b"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Brand row: the logo geometry is inlined, so the rasteriser needs no
       second file and the card cannot drift from logo.svg silently. -->
  <g transform="translate(80, 64)">
    <g transform="scale(1.85)">
      <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#logo-grad)"/>
      <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#93C5FD" opacity="0.35"/>
      <g transform="rotate(-45 20 20)">
        <circle cx="20" cy="12.4" r="6" fill="#ffffff"/>
        <rect x="17.7" y="16" width="4.6" height="14.8" rx="0.7" fill="#ffffff"/>
        <g fill="url(#logo-grad-r)">
          <circle cx="20" cy="12.4" r="2.6"/>
          <rect x="20.2" y="22.6" width="2.1" height="2" rx="0.35"/>
          <rect x="20.2" y="26.4" width="2.1" height="2" rx="0.35"/>
        </g>
      </g>
    </g>
    <text x="92" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">pkinative</text>
  </g>
  <text x="1120" y="106" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="22" fill="#64748b">pkinative.dev</text>

  <!-- Headline: the structural sibling of zipnative's "Native ZIP / for
       TypeScript" — a noun phrase naming the thing, not a slogan. It names
       the domain rather than X.509, for the same reason the mark is a key:
       CMS, OCSP, CRL, timestamps and PKCS#8/#12 are all in scope by 1.0 and
       none of them is X.509. The concrete terms are on the pills below. -->
  <text x="80" y="280" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="-2">Native PKI</text>
  <text x="80" y="380" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" fill="url(#accent)" letter-spacing="-2">for TypeScript</text>

  <!-- Subtitles carry the honesty, where the siblings carry theirs: what the
       library refuses, and which milestone verifies. -->
  <text x="80" y="436" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="500" fill="#e2e8f0">Strict by default · complete by RFC 5280 · honest about what it refuses</text>
  <text x="80" y="472" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" fill="#94a3b8">Zero dependencies — Node, browsers, Deno, Bun and Workers · 0.1 reads, 0.3 verifies</text>

  <!-- The two highlighted pills take the slot zipnative gives CLI and MCP.
       They are the only claims here a stranger can check without trusting us. -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
     font-size="22" fill="#cbd5e1" text-anchor="middle">
    <rect x="80" y="510" width="152" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="156" y="541">Strict DER</text>
    <rect x="248" y="510" width="148" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="322" y="541">RFC 5280</text>
    <rect x="412" y="510" width="98" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="461" y="541">PEM</text>
    <rect x="526" y="510" width="102" height="48" rx="24" fill="#ffffff" fill-opacity="0.05" stroke="#334155"/>
    <text x="577" y="541">OIDs</text>
    <rect x="644" y="510" width="160" height="48" rx="24" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
    <text x="724" y="541" fill="#bfdbfe">x509-limbo</text>
    <rect x="820" y="510" width="170" height="48" rx="24" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
    <text x="905" y="541" fill="#bfdbfe">Wycheproof</text>
  </g>

  <text x="1120" y="596" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#475569">library · MIT · open source · pre-1.0 is a git tag, not an npm release</text>
</svg>
