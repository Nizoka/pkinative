<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="pkinative — read the certificates your software trusts">
<!--
  pkinative Open Graph / social share image (1200x630).
  Editable vector source. Rasterise to og-image.png with headless
  Chromium/Edge using a window size of 1200x630 and the screenshot flag:
    msedge ++headless ++disable-gpu ++hide-scrollbars ++window-size=1200,630
           ++screenshot=og-image.png og-image.svg
  (replace ++ with double dashes). The committed PNG is the artefact of
  record — no social platform renders SVG — and docs/assets/ecosystem.json
  records the SHA-256 of this file, so editing it without re-rasterising
  fails the social-images rule of `npm run verify:docs`. Text renders
  through the system font stack, so rasterise on a machine with Segoe UI
  or equivalent.
  Brand charter (shared with pdfnative and zipnative): primary #2563eb,
  primary-dim #60a5fa on bg #0f172a, text #f1f5f9 / #e2e8f0.
-->
  <rect width="1200" height="630" fill="#0f172a"/>
  <path d="M150 150 90 172v43c0 38 26 66 60 75 34-9 60-37 60-75v-43Z" fill="#2563eb"/>
  <circle cx="135" cy="215" r="20" fill="none" stroke="#ffffff" stroke-width="9"/>
  <path d="M153 215h37m-12 0v17m-12-17v12" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <text x="250" y="235" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="84" font-weight="700" fill="#f1f5f9">pkinative</text>
  <text x="90" y="380" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="44" fill="#e2e8f0">Read the certificates your software trusts —</text>
  <text x="90" y="440" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="44" fill="#e2e8f0">strictly, safely, on every runtime.</text>
  <text x="90" y="540" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" fill="#60a5fa">0 dependencies · strict DER · RFC 5280 · x509-limbo · Wycheproof</text>
</svg>
