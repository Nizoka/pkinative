<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ucdec-title ucdec-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="ucdec-title">The decision path: bytes enter, and one of three things leaves</title>
  <desc id="ucdec-desc">Architecture: untrusted bytes reach decodeAsn1, an iterative strict-DER decoder, which either throws a PkiEncodingError or a PkiLimitError with a stable code, or produces a value tree. The tree reaches parseCertificate, which either throws a PkiCertificateError or returns a Certificate of zero-copy views together with any diagnostics. A green band states the guarantee: three exits, never a fourth, and depth is a limit rather than a stack overflow. A slate band states the limits: branch on error.code, never on the message, and a parsed certificate is read, not yet trusted.</desc>

  <defs>
    <marker id="ucdec-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ucdec-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">The decision path: three exits, never a fourth</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">decodeAsn1 → parseCertificate — every refusal carries a stable code you branch on</text>

  <!-- Untrusted bytes (neutral) -->
  <rect x="40" y="196" width="160" height="76" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="120" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Untrusted bytes</text>
  <text x="120" y="248" text-anchor="middle" font-size="11.5" fill="#64748B">DER from anywhere</text>

  <line x1="200" y1="234" x2="224" y2="234" stroke="#475569" stroke-width="1.75" marker-end="url(#ucdec-ah)"/>

  <!-- decodeAsn1 (cyan) -->
  <rect x="228" y="196" width="200" height="76" rx="12" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="328" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#155E75">decodeAsn1</text>
  <text x="328" y="248" text-anchor="middle" font-size="11.5" fill="#0E7490">iterative · strict DER</text>

  <line x1="428" y1="234" x2="464" y2="234" stroke="#475569" stroke-width="1.75" marker-end="url(#ucdec-ah)"/>

  <!-- parseCertificate (cyan) -->
  <rect x="468" y="196" width="210" height="76" rx="12" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="573" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#155E75">parseCertificate</text>
  <text x="573" y="248" text-anchor="middle" font-size="11.5" fill="#0E7490">RFC 5280, every field read</text>

  <!-- the two ways out that are values -->
  <path d="M678 222 H698 V190 H716" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#ucdec-ah)"/>
  <path d="M678 246 H698 V278 H716" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#ucdec-ah)"/>

  <!-- Certificate (amber) -->
  <rect x="720" y="160" width="200" height="60" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="820" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">Certificate</text>
  <text x="820" y="205" text-anchor="middle" font-size="11.5" fill="#B45309">zero-copy views of the input</text>

  <!-- diagnostics (blue) -->
  <rect x="720" y="248" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="820" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">+ diagnostics</text>
  <text x="820" y="293" text-anchor="middle" font-size="11.5" fill="#1E40AF">through onDiagnostic</text>

  <!-- refusal from the decoder (red) -->
  <line x1="328" y1="196" x2="328" y2="160" stroke="#DC2626" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ucdec-ah-red)"/>
  <rect x="168" y="92" width="320" height="64" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="328" y="119" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">PkiEncodingError · PkiLimitError</text>
  <text x="328" y="139" text-anchor="middle" font-size="11.5" fill="#B91C1C">thrown · stable code · a named, CWE-tagged limit</text>

  <!-- refusal from the certificate reader (red) -->
  <line x1="573" y1="272" x2="573" y2="308" stroke="#DC2626" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ucdec-ah-red)"/>
  <rect x="413" y="312" width="320" height="64" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="573" y="339" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">PkiCertificateError</text>
  <text x="573" y="359" text-anchor="middle" font-size="11.5" fill="#B91C1C">thrown · stable code · the message names the remedy</text>

  <!-- guarantees band (green) -->
  <rect x="40" y="416" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Three exits, never a fourth: a Certificate with its diagnostics, or a thrown refusal carrying a code.</text>
  <text x="480" y="460" text-anchor="middle" font-size="12.5" fill="#16A34A">The decoder is iterative, so depth is a limit and not a stack overflow. What a refusal never is, is silence.</text>

  <!-- limits band (slate) -->
  <rect x="40" y="488" width="880" height="44" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="515" text-anchor="middle" font-size="12" fill="#475569">Honest limits: branch on error.code, never on the message — and a parsed certificate is read, not yet trusted.</text>
</svg>
