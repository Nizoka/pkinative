<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <desc>pkinative logo — the X-series mark: a woven X monogram with the dot of dotted notation, for the ITU-T X.509 and X.690 recommendations it reads</desc>
  <defs>
    <!-- userSpaceOnUse over the tile's own box. Identical to the siblings'
         objectBoundingBox ramp on this rect, but it lets the counter-shapes
         below take the tile's exact local colour instead of re-running the
         whole ramp inside a three-unit quad. -->
    <linearGradient id="logo-grad" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#logo-grad)"/>
  <!-- Folded corner — the family mark shared with pdfnative and zipnative -->
  <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#93C5FD" opacity="0.35"/>
  <path d="M25.5 3L37 16" stroke="#ffffff" stroke-width="0.8" opacity="0.35" fill="none"/>
  <!-- X monogram: two straps with horizontal terminals, a letterform not a symbol -->
  <path d="M9.5 10h5.4L26.5 30h-5.4z M21.1 10h5.4L14.9 30H9.5z" fill="#ffffff"/>
  <!-- The crossing woven: the descending strap passes over, so the ascending
       one is cut on both sides of it. Fades below ~20px, as intended. -->
  <g fill="url(#logo-grad)">
    <path d="M18 15.35L18.75 14.05 21.45 18.71 20.7 20z"/>
    <path d="M18 24.65L17.25 25.95 14.55 21.29 15.3 20z"/>
  </g>
  <!-- The dot of dotted notation: X.509, X.690, X.500 -->
  <rect x="28" y="26.2" width="3.8" height="3.8" rx="1.3" fill="#ffffff"/>
</svg>
