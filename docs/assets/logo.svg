<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <desc>pkinative logo — the family tile with a key: public key infrastructure, which is what the name says and what the library will be through 1.0</desc>
  <defs>
    <!-- userSpaceOnUse over the tile's own box. Identical to the siblings'
         objectBoundingBox ramp on this rect, but it lets the counter-shapes
         below take the tile's exact local colour instead of re-running the
         whole ramp inside a two-unit square. -->
    <linearGradient id="logo-grad" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- The same ramp, counter-rotated so that shapes inside the key's
         rotated group still sample the tile's gradient rather than a
         rotated copy of it. rotate(45) cancels the group's rotate(-45). -->
    <linearGradient id="logo-grad-r" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="37" y2="37"
                    gradientTransform="rotate(45 20 20)">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="3" y="3" width="34" height="34" rx="8" fill="url(#logo-grad)"/>
  <!-- Folded corner — the family mark shared with pdfnative and zipnative -->
  <path d="M25.5 3h5a6 6 0 0 1 6.5 6.5V16L25.5 3z" fill="#93C5FD" opacity="0.35"/>
  <path d="M25.5 3L37 16" stroke="#ffffff" stroke-width="0.8" opacity="0.35" fill="none"/>
  <!-- The key, drawn upright and rotated onto the tile's diagonal so it
       fills the square the way zipnative's Z does. -->
  <g transform="rotate(-45 20 20)">
    <circle cx="20" cy="12.4" r="6" fill="#ffffff"/>
    <rect x="17.7" y="16" width="4.6" height="14.8" rx="0.7" fill="#ffffff"/>
    <!-- The bow's eye and the two wards, cut out of the white body in the
         tile's own gradient — the technique zipnative uses for its zipper
         teeth, which is what makes the two marks read as a pair. -->
    <g fill="url(#logo-grad-r)">
      <circle cx="20" cy="12.4" r="2.6"/>
      <rect x="20.2" y="22.6" width="2.1" height="2" rx="0.35"/>
      <rect x="20.2" y="26.4" width="2.1" height="2" rx="0.35"/>
    </g>
  </g>
</svg>
