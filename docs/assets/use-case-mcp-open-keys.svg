<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ucok-title ucok-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="ucok-title">Opening keys safely</title>
  <desc id="ucok-desc">Architecture: following the open_keys_safely prompt, an MCP agent first describes a PKCS#12 file and an encrypted key without a password, with inspect_pkcs12 and inspect_private_key, then opens them with inspect_private_key tryImport and open_pkcs12. Files are read by path from the PKINATIVE_MCP_OUTPUT_DIR sandbox, and the password comes from PKINATIVE_MCP_PASSWORD or the password input, never echoed. The engine decrypts into non-extractable Web Crypto keys; reports carry no key byte. Limits: a legacy file is valid false, unverified; both password channels at once is refused.</desc>

  <defs>
    <marker id="ucok-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ucok-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Opening keys safely</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">open_keys_safely prompt · describe before opening, open without exporting — pkinative-mcp 1.0.0</text>

  <!-- Result path: the report back to the agent (routed above the row) -->
  <path d="M429 116 L429 100 L135 100 L135 114" fill="none" stroke="#16A34A" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#ucok-ah-green)"/>
  <text x="480" y="92" text-anchor="middle" font-size="11" fill="#15803D">tools/call result: valid · integrity · reasonCodes · key descriptions — never a key byte (every key view is an allow-list)</text>

  <!-- Agent -->
  <rect x="40" y="116" width="190" height="124" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="135" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Agent</text>
  <text x="135" y="158" text-anchor="middle" font-size="11.5" fill="#64748B">MCP client</text>
  <rect x="52" y="168" width="166" height="42" rx="8" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="135" y="185" text-anchor="middle" font-size="11" fill="#4F46E5">prompts/get</text>
  <text x="135" y="201" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730A3">open_keys_safely</text>
  <text x="135" y="228" text-anchor="middle" font-size="11.5" fill="#64748B">“what do these hold?”</text>

  <line x1="230" y1="180" x2="256" y2="180" stroke="#475569" stroke-width="1.75" marker-end="url(#ucok-ah)"/>

  <!-- Password channels -->
  <rect x="40" y="264" width="190" height="128" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.25"/>
  <text x="135" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#3730A3">Two password channels</text>
  <text x="135" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">PKINATIVE_MCP_PASSWORD</text>
  <text x="135" y="322" text-anchor="middle" font-size="11" fill="#4F46E5">kept out of the transcript</text>
  <text x="135" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">password input</text>
  <text x="135" y="362" text-anchor="middle" font-size="11" fill="#4F46E5">lands in the transcript</text>
  <text x="135" y="380" text-anchor="middle" font-size="11" fill="#4F46E5">never echoed, never cached</text>

  <line x1="230" y1="330" x2="256" y2="330" stroke="#475569" stroke-width="1.75" marker-end="url(#ucok-ah)"/>

  <!-- Server -->
  <rect x="258" y="116" width="342" height="276" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="429" y="137" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">pkinative-mcp — no key byte returned</text>
  <rect x="270" y="146" width="318" height="50" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="429" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">1 · inspect_pkcs12 — describe</text>
  <text x="429" y="183" text-anchor="middle" font-size="11" fill="#3B82F6">no password: MAC kind, bags · legacy recognised</text>
  <rect x="270" y="202" width="318" height="50" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="429" y="221" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">2 · inspect_private_key — describe</text>
  <text x="429" y="239" text-anchor="middle" font-size="11" fill="#3B82F6">PBES2 scheme · iterations · encrypted bytes</text>
  <rect x="270" y="258" width="318" height="50" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="429" y="277" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">3 · inspect_private_key — tryImport: true</text>
  <text x="429" y="295" text-anchor="middle" font-size="11" fill="#3B82F6">password + keyType → non-extractable key</text>
  <rect x="270" y="314" width="318" height="50" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="429" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E40AF">4 · open_pkcs12</text>
  <text x="429" y="351" text-anchor="middle" font-size="11" fill="#3B82F6">integrity · keyCount · certificateCount</text>
  <text x="429" y="381" text-anchor="middle" font-size="11" fill="#3B82F6">exportCertificates: a PEM bundle, never a key</text>

  <line x1="600" y1="172" x2="628" y2="172" stroke="#475569" stroke-width="1.75" marker-end="url(#ucok-ah)"/>

  <!-- Engine -->
  <rect x="630" y="116" width="290" height="104" rx="10" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="775" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#155E75">pkinative engine</text>
  <text x="775" y="162" text-anchor="middle" font-size="11.5" fill="#0E7490">PBES2 (PBKDF2 + AES-CBC) · PBMAC1 only</text>
  <text x="775" y="180" text-anchor="middle" font-size="11.5" fill="#0E7490">decrypts into a non-extractable</text>
  <text x="775" y="198" text-anchor="middle" font-size="11.5" fill="#0E7490">Web Crypto key — exportKey refused</text>

  <!-- Sandbox → server -->
  <line x1="630" y1="318" x2="602" y2="318" stroke="#475569" stroke-width="1.75" marker-end="url(#ucok-ah)"/>

  <!-- Sandbox -->
  <rect x="630" y="244" width="290" height="148" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="775" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400E">PKINATIVE_MCP_OUTPUT_DIR — the sandbox</text>
  <text x="775" y="288" text-anchor="middle" font-size="11" fill="#B45309">read by path: fixtures/leaf.p12,</text>
  <text x="775" y="304" text-anchor="middle" font-size="11" fill="#B45309">fixtures/leaf.key.enc.pem</text>
  <text x="775" y="328" text-anchor="middle" font-size="11" fill="#B45309">key-bearing files (.key .p8 .p12 .pfx)</text>
  <text x="775" y="344" text-anchor="middle" font-size="11" fill="#B45309">are never written, never listed</text>
  <text x="775" y="360" text-anchor="middle" font-size="11" fill="#B45309">and never served as resources</text>

  <!-- Guarantees -->
  <rect x="40" y="414" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">No report ever carries a key byte: every key view is an allow-list, and keys stay non-extractable Web Crypto handles.</text>
  <text x="480" y="457" text-anchor="middle" font-size="12" fill="#16A34A">A wrong password on open_pkcs12 is valid: false, PKI_REASON_PKCS12_MAC_MISMATCH — nothing is decrypted.</text>

  <!-- Limits -->
  <rect x="40" y="482" width="880" height="52" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="503" text-anchor="middle" font-size="12" fill="#475569">Limits: a legacy RC2 / 3DES file opens as valid: false, integrity “unverified”; explain_code gives the OpenSSL 3.4 conversion.</text>
  <text x="480" y="522" text-anchor="middle" font-size="12" fill="#475569">Both password channels at once is VALIDATION_ERROR; an RSA key opens only with rsaScheme 'pkcs1' or 'pss'.</text>
</svg>
