<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="uckey-title uckey-desc" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
  <title id="uckey-title">Private keys and PKCS#12, without the key ever becoming bytes</title>
  <desc id="uckey-desc">Architecture: a PKCS#8 key, an encrypted PKCS#8 key, or a .p12 file and its password flow into openPkcs12 or the primitives under it, importPrivateKey and decryptPrivateKey. They parse without a password, verify only an RFC 9579 PBMAC1 MAC and otherwise fail closed, open PBES2 alone, and take each key's algorithm from the certificate sharing its localKeyId. The host's Web Crypto unwraps the key into a non-extractable CryptoKey. Out come an OpenPkcs12Report with keys and certificates, or a refusal by name. Bands: the key never becomes bytes pkinative holds; legacy schemes are refused.</desc>

  <defs>
    <marker id="uckey-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="uckey-ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
    <marker id="uckey-ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Private keys and PKCS#12</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748B">openPkcs12 · decryptPrivateKey · importPrivateKey → a non-extractable SigningKey</text>

  <!-- Inputs (indigo) -->
  <rect x="40" y="110" width="204" height="180" rx="12" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="142" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#3730A3">Files you were given</text>
  <text x="142" y="160" text-anchor="middle" font-size="11.5" fill="#4F46E5">PRIVATE KEY — PKCS#8</text>
  <text x="142" y="178" text-anchor="middle" font-size="11.5" fill="#4F46E5">ENCRYPTED PRIVATE KEY</text>
  <text x="142" y="196" text-anchor="middle" font-size="11.5" fill="#4F46E5">.p12 / .pfx + password</text>
  <text x="142" y="226" text-anchor="middle" font-size="11.5" fill="#64748B">an RSA scheme, named</text>
  <text x="142" y="244" text-anchor="middle" font-size="11.5" fill="#64748B">by you: rsaAlgorithm</text>
  <text x="142" y="262" text-anchor="middle" font-size="11.5" fill="#64748B">— never guessed</text>

  <line x1="244" y1="200" x2="276" y2="200" stroke="#475569" stroke-width="1.75" marker-end="url(#uckey-ah)"/>

  <!-- Engine (cyan) -->
  <rect x="280" y="88" width="360" height="304" rx="12" fill="#ECFEFF" stroke="#5EBECF" stroke-width="1.5"/>
  <text x="460" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155E75">openPkcs12 and the primitives under it</text>

  <rect x="296" y="126" width="328" height="56" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="460" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">parsePkcs12 — no password needed</text>
  <text x="460" y="169" text-anchor="middle" font-size="11.5" fill="#0E7490">describe before you decrypt</text>

  <rect x="296" y="192" width="328" height="56" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="460" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">MAC: RFC 9579 PBMAC1 only</text>
  <text x="460" y="235" text-anchor="middle" font-size="11.5" fill="#0E7490">else PKI_REASON_PKCS12_INTEGRITY_UNVERIFIED</text>

  <rect x="296" y="258" width="328" height="56" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="460" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">PBES2 only, by policy</text>
  <text x="460" y="301" text-anchor="middle" font-size="11.5" fill="#0E7490">PBKDF2 + AES-CBC · maxKdfIterations first</text>

  <rect x="296" y="324" width="328" height="56" rx="10" fill="#FFFFFF" stroke="#5EBECF" stroke-width="1.25"/>
  <text x="460" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#155E75">The algorithm, before decrypting</text>
  <text x="460" y="367" text-anchor="middle" font-size="11.5" fill="#0E7490">from the certificate sharing localKeyId</text>

  <!-- to the host and the outputs -->
  <line x1="640" y1="140" x2="676" y2="140" stroke="#475569" stroke-width="1.75" marker-end="url(#uckey-ah)"/>
  <line x1="640" y1="252" x2="676" y2="252" stroke="#16A34A" stroke-width="2" marker-end="url(#uckey-ah-green)"/>
  <line x1="640" y1="354" x2="676" y2="354" stroke="#DC2626" stroke-width="2" marker-end="url(#uckey-ah-red)"/>

  <!-- Web Crypto (blue) -->
  <rect x="680" y="92" width="240" height="96" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.25"/>
  <text x="800" y="117" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E40AF">Web Crypto — the host</text>
  <text x="800" y="138" text-anchor="middle" font-size="11.5" fill="#1E40AF">unwrapKey straight into</text>
  <text x="800" y="156" text-anchor="middle" font-size="11.5" fill="#1E40AF">a CryptoKey handle:</text>
  <text x="800" y="174" text-anchor="middle" font-size="11.5" fill="#1E40AF">extractable: false · sign</text>

  <line x1="800" y1="188" x2="800" y2="200" stroke="#475569" stroke-width="1.75" marker-end="url(#uckey-ah)"/>

  <!-- Report (amber) -->
  <rect x="680" y="204" width="240" height="96" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.25"/>
  <text x="800" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400E">OpenPkcs12Report</text>
  <text x="800" y="250" text-anchor="middle" font-size="11.5" fill="#B45309">keys: signingKey + certificate</text>
  <text x="800" y="268" text-anchor="middle" font-size="11.5" fill="#B45309">integrity: verified, unverified</text>
  <text x="800" y="286" text-anchor="middle" font-size="11.5" fill="#B45309">or mismatch · reasons</text>

  <!-- Refused (red) -->
  <rect x="680" y="316" width="240" height="76" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
  <text x="800" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991B1B">Refused by name</text>
  <text x="800" y="360" text-anchor="middle" font-size="11.5" fill="#B91C1C">PKI_KEY_ENCRYPTION_UNSUPPORTED</text>
  <text x="800" y="378" text-anchor="middle" font-size="11.5" fill="#B91C1C">3DES · RC2 · PBES1</text>

  <!-- guarantees band (green) -->
  <rect x="40" y="416" width="880" height="56" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">The key never becomes bytes pkinative holds: every SigningKey is extractable: false, with the single usage sign.</text>
  <text x="480" y="460" text-anchor="middle" font-size="12.5" fill="#16A34A">An encrypted key is unwrapped by the host straight into that handle — the decrypted PKCS#8 is never a JavaScript value.</text>

  <!-- limits band (slate) -->
  <rect x="40" y="486" width="880" height="56" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="480" y="509" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Honest limits: RFC 7292 Appendix C ciphers, PBES1 and Appendix B MACs are refused — a refusal, not a backlog.</text>
  <text x="480" y="528" text-anchor="middle" font-size="12" fill="#475569">allowUnverifiedIntegrity: true is a decision about the file's origin; a legacy file converts once, with OpenSSL 3.4 or later.</text>
</svg>
