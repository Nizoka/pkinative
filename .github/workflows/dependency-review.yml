name: Dependency Review

# Fails on a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# pkinative has zero runtime dependencies, so this covers the dev toolchain
# (and any attempt to add a runtime one). `dependency-review` is a required
# check in .github/rulesets/main.json, so the failure blocks the merge.
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # The required check name (.github/rulesets/main.json) — keep it equal.
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Read the manifests and lockfile on both sides of the diff.
      pull-requests: write # Needed for comment-summary-in-pr.

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.securityscorecards.dev:443
            api.deps.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense
          # The REUSE tool and the one dependency of it under the GPL are run on
          # the runner by the `workflow lint` job (scripts/data/reuse-requirements.txt):
          # never shipped, never linked, never part of the package, so their
          # copyleft never reaches a user. Exempted by name, not by licence: a
          # GPL package anywhere else still fails this check.
          allow-dependencies-licenses: pkg:pypi/reuse, pkg:pypi/python-debian
          comment-summary-in-pr: on-failure
