# Documentation consistency
# =========================
# ci.yml runs the whole gate — verify:docs included — on every pull request.
# This workflow is the fast, documentation-only answer to the same question
# (in pdfnative, a docs-only pull request that triggered nothing is how the
# site came to advertise 19 MCP tools against a server registering 24): it
# runs scripts/verify-docs.ts against docs/assets/ecosystem.json, the single
# source of truth for every version, count and inventory quoted anywhere in
# the documentation.
#
# The PR job is hermetic (no network). A weekly scheduled job compares the
# manifest against the npm registry (scripts/check-npm-drift.ts, anonymous
# `npm view`, no secret), so a published release that the docs have not
# caught up with — or, below 1.0.0, any version beyond the 0.0.1 name
# reservation, which would mean publish.yml's refusal did not hold — surfaces
# on its own rather than at the next audit.

name: Docs

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/verify-docs/**'
      - 'scripts/lib/**'
      - '.github/**'
      - '.claude/**'
      # The api-exists and error-parity rules cross-check the docs against
      # src/, so a rename there can break the docs without touching them.
      - 'src/**'
      - 'package.json'
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/verify-docs/**'
      - 'scripts/lib/**'
      - '.github/**'
      - '.claude/**'
      - 'src/**'
      - 'package.json'
  schedule:
    # Mondays 06:00 UTC — catch npm drift without blocking anyone's PR.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Verify documentation
        run: npm run verify:docs

  # The rendered site under axe-core, every page in the light and the dark
  # palette, WCAG 2.2 A and AA plus best practices: what a11y-structure cannot
  # see in the HTML alone (contrast, focus, ARIA that resolves). axe-core is
  # loaded by the harness from jsDelivr, pinned by version and SRI hash — the
  # same CDN and the same pinning as the Prism the pages themselves load.
  # Blocking: one violation is a red job (scripts/a11y-check.ts).
  a11y:
    name: Accessibility (axe, light and dark)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            cdn.jsdelivr.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run axe over every page, light and dark
        run: |
          google-chrome --version
          npm run check:a11y

  npm-drift:
    name: Check the manifest against npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on the schedule and on manual runs: a package published between a
    # PR opening and merging should not turn someone else's docs change red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-01: `verify-docs --online` reaches every URL the docs cite; no fixed list

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the npm registry against the manifest
        run: npm run check:npm-drift

      - name: Verify documentation against the npm registry
        run: npx tsx scripts/verify-docs.ts --online --strict
