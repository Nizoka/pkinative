# Documentation consistency
# =========================
# ci.yml deliberately ignores `docs/**` and `**.md`, so a documentation-only
# pull request would trigger no workflow at all. In pdfnative that is how the
# site came to advertise 19 MCP tools against a server registering 24.
#
# This workflow closes that gap: it runs scripts/verify-docs.ts against
# docs/assets/ecosystem.json, the single source of truth for every version,
# count and inventory quoted anywhere in the documentation.
#
# The PR job is hermetic (no network). A weekly scheduled job compares the
# manifest against the npm registry (scripts/check-npm-drift.ts, anonymous
# `npm view`, no secret), so a published release that the docs have not
# caught up with — or, below 1.0.0, any version beyond the 0.0.1 name
# reservation, which would mean publish.yml's refusal did not hold — surfaces
# on its own rather than at the next audit.

name: Docs

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/verify-docs/**'
      - 'scripts/lib/**'
      - '.github/**'
      - '.claude/**'
      # The api-exists and error-parity rules cross-check the docs against
      # src/, so a rename there can break the docs without touching them.
      - 'src/**'
      - 'package.json'
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'llms.txt'
      - 'recipes/**'
      - 'bench/**'
      - 'scripts/verify-docs.ts'
      - 'scripts/verify-docs/**'
      - 'scripts/lib/**'
      - '.github/**'
      - '.claude/**'
      - 'src/**'
      - 'package.json'
  schedule:
    # Mondays 06:00 UTC — catch npm drift without blocking anyone's PR.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Verify documentation
        run: npm run verify:docs

  npm-drift:
    name: Check the manifest against npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on the schedule and on manual runs: a package published between a
    # PR opening and merging should not turn someone else's docs change red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the npm registry against the manifest
        run: npm run check:npm-drift

      - name: Verify documentation against the npm registry
        run: npx tsx scripts/verify-docs.ts --online --strict
