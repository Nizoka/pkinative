name: Conformance

# The independent conformance barrier (scripts/validate-certs.ts) — the
# analogue of pdfnative's veraPDF gate and zipnative's ISO/IEC 21320-1 gate.
# It runs the BUILT package over corpora pinned by commit and SHA-256
# (scripts/lib/corpora.ts, .github/checksums/): every x509-limbo certificate
# parses or is refused only where limbo expects failure, re-encodes byte for
# byte, agrees with node:crypto and the openssl CLI; every Wycheproof ECDSA
# signature decodes strictly. `--require-all` turns a missing tool into a
# failure. Tool versions are echoed first, so a red run is attributable to
# "our bug" or to "runner image drift".
#
# No path filter: the ruleset requires the `conformance` check on every pull
# request, and a filtered-out required check would block the merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `name:` decides the status-check name, so the `conformance` context the
  # ruleset already requires keeps exactly the name it had as a single job,
  # and the two platform runs are additive. Renaming a required check is what
  # leaves every pull request waiting on a context that never reports again.
  #
  # Running the corpus on three platforms is not redundancy: the CLI the L3
  # level cross-checks against differs by runner — OpenSSL on Linux, the Git
  # for Windows build on Windows, LibreSSL on macOS — so a disagreement that
  # only one of them sees is exactly what this matrix is for.
  conformance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: conformance, os: ubuntu-latest, slug: linux }
          - { name: conformance-windows, os: windows-latest, slug: windows }
          - { name: conformance-macos, os: macos-latest, slug: macos }

    steps:
      # Harden-Runner's README at the pinned SHA lists GitHub-hosted Windows
      # and macOS runners as supported in audit mode, and Linux with block mode
      # as well. One step serves the three legs, so the policy is the one the
      # Windows and macOS legs allow.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-01: audit only on Windows/macOS (vendor matrix), and one step serves every leg

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The Linux readers REQUIRED_TOOLS.linux names (scripts/lib/interop.ts),
      # which the ubuntu image does not carry. Every one is pinned: GnuTLS and
      # gpgsm by the distribution's signed archive; Go by the setup-go commit
      # below; zlint by its module version, which the Go checksum database
      # verifies; pyca/cryptography and pkilint by version AND the SHA-256 of
      # every file (--require-hashes), with --only-binary so nothing is built.
      # `interop-matrix-declared` fails if one of them stops being installed
      # here, because --require-all would then turn its absence red.
      - name: Install the Linux interoperability readers (GnuTLS, gpgsm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnutls-bin gpgsm

      - name: Setup Go (crypto/x509 reader, zlint)
        if: runner.os == 'Linux'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: false

      - name: Install zlint and the Python readers (pinned)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/zmap/zlint/v3/cmd/zlint@v3.7.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/interop-python"
          "$RUNNER_TEMP/interop-python/bin/python" -m pip install --require-hashes --no-deps --only-binary :all: -r scripts/data/interop-python-requirements.txt
          echo "$RUNNER_TEMP/interop-python/bin" >> "$GITHUB_PATH"

      # Explicitly bash: the default shell on the Windows runner is PowerShell,
      # where none of this parses. A red run has to be attributable to "our
      # bug" or to "runner image drift", and that needs the versions.
      - name: Record tool versions
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          {
            echo "## Conformance tool versions (${RUNNER_LABEL})"
            echo '```'
            echo "node $(node --version), bundled OpenSSL $(node -p process.versions.openssl)"
            openssl version || echo 'openssl CLI: not found'
            certtool --version 2>/dev/null | head -n 1 || true
            gpgsm --version 2>/dev/null | head -n 1 || true
            go version 2>/dev/null || true
            zlint -version 2>&1 | head -n 1 || true
            python3 -c 'import cryptography, importlib.metadata as m; print("cryptography", cryptography.__version__, "pkilint", m.version("pkilint"))' 2>/dev/null || true
            # shellcheck disable=SC2016 # the $ belongs to PowerShell, not to bash
            pwsh -NoProfile -Command '"PowerShell $($PSVersionTable.PSVersion) on $([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription)"' 2>/dev/null || true
            java --version 2>/dev/null | head -n 1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the package under test
        run: npm run build

      - name: Fetch the pinned corpora (SHA-256 verified)
        run: npm run conformance:fetch

      - name: Run the conformance gate (blocking)
        run: npx tsx scripts/validate-certs.ts --require-all

      # Both directions: foreign tools reading what pkinative writes, and
      # pkinative reading what they write. This job's three contexts are
      # already required by the ruleset, so the matrix is blocking on Linux,
      # Windows and macOS without the ruleset changing at all.
      #
      # --require-all: a tool REQUIRED_TOOLS names for this runner — Linux:
      # openssl, GnuTLS, Go, pyca/cryptography, zlint, pkilint; Windows:
      # openssl, CryptoAPI, .NET; macOS: openssl — that is missing fails the
      # job instead of being skipped. Every other tool runs wherever the image
      # happens to carry it, and is held to the same agreement when it does.
      - name: Run the interoperability matrix (blocking)
        run: npm run interop -- --require-all

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-report-${{ matrix.slug }}
          path: test-output/conformance/report.json
          retention-days: 14
          if-no-files-found: ignore
