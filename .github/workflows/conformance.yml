name: Conformance

# The independent conformance barrier (scripts/validate-certs.ts) — the
# analogue of pdfnative's veraPDF gate and zipnative's ISO/IEC 21320-1 gate.
# It runs the BUILT package over corpora pinned by commit and SHA-256
# (scripts/lib/corpora.ts, .github/checksums/): every x509-limbo certificate
# parses or is refused only where limbo expects failure, re-encodes byte for
# byte, agrees with node:crypto and the openssl CLI; every Wycheproof ECDSA
# signature decodes strictly. `--require-all` turns a missing tool into a
# failure. Tool versions are echoed first, so a red run is attributable to
# "our bug" or to "runner image drift".
#
# No path filter: the ruleset requires the `conformance` check on every pull
# request, and a filtered-out required check would block the merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `name:` decides the status-check name, so the `conformance` context the
  # ruleset already requires keeps exactly the name it had as a single job,
  # and the two platform runs are additive. Renaming a required check is what
  # leaves every pull request waiting on a context that never reports again.
  #
  # Running the corpus on three platforms is not redundancy: the CLI the L3
  # level cross-checks against differs by runner — OpenSSL on Linux, the Git
  # for Windows build on Windows, LibreSSL on macOS — so a disagreement that
  # only one of them sees is exactly what this matrix is for.
  conformance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: conformance, os: ubuntu-latest, slug: linux }
          - { name: conformance-windows, os: windows-latest, slug: windows }
          - { name: conformance-macos, os: macos-latest, slug: macos }

    steps:
      # Harden-Runner supports Windows runners in audit mode only, and the
      # action does not support macOS at all — so it is skipped there
      # rather than left to fail.
      - name: Harden the runner
        if: runner.os != 'macOS'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Explicitly bash: the default shell on the Windows runner is PowerShell,
      # where none of this parses. A red run has to be attributable to "our
      # bug" or to "runner image drift", and that needs the versions.
      - name: Record tool versions
        shell: bash
        run: |
          {
            echo '## Conformance tool versions (${{ matrix.os }})'
            echo '```'
            echo "node $(node --version), bundled OpenSSL $(node -p process.versions.openssl)"
            openssl version || echo 'openssl CLI: not found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the package under test
        run: npm run build

      - name: Fetch the pinned corpora (SHA-256 verified)
        run: npm run conformance:fetch

      - name: Run the conformance gate (blocking)
        run: npx tsx scripts/validate-certs.ts --require-all

      # The write direction: foreign tools reading what pkinative produces.
      # This job's three contexts are already required by the ruleset, so the
      # matrix becomes blocking on Linux, Windows and macOS without the
      # ruleset changing at all.
      #
      # Deliberately NOT --require-all yet. Four tools in PENDING_TOOLS are
      # declared and not implemented, and --require-all turns each of them
      # into a failure; turning it on now would make the job red for work that
      # is scheduled rather than missed. It goes on in the commit that lands
      # the last pending tool, and `interop-matrix-declared` holds the list in
      # ROADMAP.md to the list in the runner until then.
      - name: Run the interoperability matrix (blocking)
        run: npm run interop

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-report-${{ matrix.slug }}
          path: test-output/conformance/report.json
          retention-days: 14
          if-no-files-found: ignore
