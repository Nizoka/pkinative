name: Dependency Audit

# Weekly `npm audit` of the lockfile, so an advisory published between two
# pull requests is noticed without waiting for the next CI run. CI runs the
# same command on every push and pull request (ci.yml).
#
# And OSV-Scanner over the same lockfile: OSV aggregates the GitHub Advisory
# Database with every other ecosystem feed, and it saw the three
# brace-expansion advisories of 2026-09-29 before `npm audit` did (the 1.0.0
# audit, V-06). Installed as a Go module at a fixed version, so the Go
# checksum database verifies it — no container image referenced by a
# mutable tag, no new action.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # 2026-10-01: the Go toolchain, module proxy and OSV endpoints are not baselined yet

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # osv-scanner 2.6.0 needs Go 1.27; setup-go pins GOTOOLCHAIN=local, so
      # the line is asked for here rather than fetched behind its back.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Install osv-scanner (pinned, checksum-verified)
        env:
          CGO_ENABLED: '0'
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Exits non-zero on any known vulnerability, development dependencies
      # included: a dev package runs in the release build.
      - name: Scan the lockfile
        run: osv-scanner scan source --lockfile package-lock.json
