name: Release assets

# Pre-1.0 versions are git tags, never npm releases (ROADMAP.md) — but a git
# tag alone does not install: dist/ is not committed. For every published
# GitHub release below 1.0.0 this workflow builds the tagged commit, runs the
# full publish gate (conformance included), packs the tarball, proves that it
# installs and loads as ESM and CJS, attests it and a CycloneDX SBOM with
# Sigstore build provenance, and attaches both to the release. Users install
# the attested tarball; `gh attestation verify` checks where it came from.
# From 1.0.0, publish.yml does the same next to the npm publication.
#
# Human-in-the-loop: the maintainer creates the release (the trigger);
# nothing here creates or edits one, it only attaches files to it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the version and check it against the tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          if [ "${VERSION%%.*}" = "0" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION} is 1.0.0 or later: publish.yml attests and attaches its assets."
          fi

      - name: Install dependencies
        if: steps.version.outputs.prerelease == 'true'
        run: npm ci --ignore-scripts

      - name: Fetch the pinned conformance corpora
        if: steps.version.outputs.prerelease == 'true'
        run: npm run conformance:fetch

      - name: Run the quality gate (publish profile)
        if: steps.version.outputs.prerelease == 'true'
        run: npx tsx scripts/gate.ts --publish --require-all

      - name: Generate the SBOM (CycloneDX, runtime dependencies only)
        if: steps.version.outputs.prerelease == 'true'
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "pkinative-${VERSION}.cdx.json"

      - name: Pack the tarball and prove it installs
        if: steps.version.outputs.prerelease == 'true'
        run: |
          set -euo pipefail
          npm pack
          test -f "pkinative-${VERSION}.tgz"
          npx tsx scripts/smoke-install.ts "pkinative-${VERSION}.tgz"

      - name: Attest build provenance
        if: steps.version.outputs.prerelease == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pkinative-${{ env.VERSION }}.tgz
            pkinative-${{ env.VERSION }}.cdx.json

      - name: Attach the tarball and SBOM to the GitHub release
        if: steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "pkinative-${VERSION}.tgz" "pkinative-${VERSION}.cdx.json" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            echo "::notice::No GitHub release v${VERSION} exists; the tarball and SBOM were attested but not attached."
          fi
