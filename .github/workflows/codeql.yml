name: CodeQL

# No path filter: the main ruleset's code_scanning rule needs CodeQL results
# for every pull request and its base, and a filtered-out analysis would
# leave the merge waiting for results that never come.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '27 3 * * 1'

# Read-only at the workflow level; the one write the analysis needs is granted
# to the job that needs it (OpenSSF Scorecard, Token-Permissions).
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # Upload the analysis to code scanning.
      actions: read # Read the workflow run the analysis belongs to.
      contents: read # Read the source.

    # `actions` reads the workflows themselves (injection, untrusted checkout,
    # excessive permissions); `javascript-typescript` the engine and the
    # scripts. Neither needs a build: CodeQL extracts both from source.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: javascript-typescript, build-mode: none }

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-01: the CodeQL bundle and its query packs come from hosts not baselined yet

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
