name: Scorecard supply-chain security

on:
  # Run on a schedule to keep the public security posture report fresh.
  schedule:
    - cron: '27 3 * * 1'
  # Run on changes to branch protection / workflows / security files.
  push:
    branches: [main, master]

# Read-only at the workflow level (the Scorecard API refuses results from a
# workflow with a top-level write); the job holds what it needs.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # Needed to upload the SARIF results to the Security tab.
      id-token: write # Needed to publish signed results to the OpenSSF public dataset.
      contents: read # Optional: read repository metadata (branch protection, etc.).
      actions: read # Read the workflow runs and their files, which several checks score.

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-01: the Scorecard API and the GitHub APIs it walks are not baselined yet

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results to the OpenSSF Scorecard public API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif
