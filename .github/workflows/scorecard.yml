name: Scorecard supply-chain security

on:
  # Run on a schedule to keep the public security posture report fresh.
  schedule:
    - cron: '27 3 * * 1'
  # Run on changes to branch protection / workflows / security files.
  push:
    branches: [main, master]

# Read-only at the workflow level (the Scorecard API refuses results from a
# workflow with a top-level write); the job holds what it needs.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # Needed to upload the SARIF results to the Security tab.
      id-token: write # Needed to publish signed results to the OpenSSF public dataset.
      contents: read # Optional: read repository metadata (branch protection, etc.).
      actions: read # Read the workflow runs and their files, which several checks score.

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-01: the Scorecard API and the GitHub APIs it walks are not baselined yet

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results to the OpenSSF Scorecard public API.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
