name: CI

# Both jobs run `scripts/gate.ts --ci`, the single definition of "green": the
# step list lives in that file's STEPS table and is not repeated here, so CI
# and the contributor loop cannot drift apart. `--require-all` turns any SKIP
# into a FAIL: a runner missing a tool goes red instead of quietly passing.
#
# `npm audit` runs outside the gate on purpose: the gate is hermetic (no
# network) so its verdict is the same on a laptop and on a runner.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.md'
      - '.github/FUNDING.yml'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, four runs. `name:` is what decides the status-check name, so the
  # three contexts the ruleset already requires — `ci (22)`, `ci (24)` and
  # `windows` — keep exactly the names they had when they were separate jobs,
  # and `macos` is purely additive. Renaming a required check is what leaves
  # every pull request waiting for a context that will never report again.
  #
  # Windows and macOS are blocking from day one (zipnative doctrine): CRLF
  # line endings in PEM files, path separators in the scripts, the npm.cmd
  # shim and LibreSSL in place of OpenSSL are facts a Linux runner never
  # exercises. Any "skip on this platform" needs a linked issue. Both non-
  # Linux platforms run the Node version of .nvmrc; the second Node version
  # is covered on Linux, where the runners are fastest.
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ci (22)', os: ubuntu-latest, node-version: 22, slug: linux-node22, audit: true }
          - { name: 'ci (24)', os: ubuntu-latest, node-version: 24, slug: linux-node24, audit: false }
          - { name: windows, os: windows-latest, node-version: 22, slug: windows, audit: false }
          - { name: macos, os: macos-latest, node-version: 22, slug: macos, audit: false }

    steps:
      # Harden-Runner supports Windows runners in audit mode only, so this job
      # can never move to `egress-policy: block`. The action also
      # does not support macOS at all, which is why it is skipped there
      # rather than left to fail. The step stays first on every other runner,
      # so the workflow invariant (tests/tools/workflows.test.ts) holds.
      - name: Harden the runner
        if: runner.os != 'macOS'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No lifecycle script of any dependency runs on the runner; the
      # repository's own .npmrc says the same for every developer machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Once per commit, not once per platform: the advisory database does not
      # depend on the runner, and four identical network calls are four
      # chances to go red for a reason that is not this repository's.
      - name: Audit dependencies
        if: matrix.audit
        run: npm audit --audit-level=high

      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-logs-${{ matrix.slug }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore
